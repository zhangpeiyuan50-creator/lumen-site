<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 472 120" width="472" height="120" role="img" aria-label="LUMEN">
  <title>LUMEN Wordmark</title>
  <!--
    Custom geometric letterforms, drawn as filled ribbons.
    Cap height 100 (y 10→110), ribbon width 13 (measured horizontally),
    tracking 22. Every terminal is a flat cut — no stroke, no mitre spikes.
  -->
  <g fill="#0F0F14">
    <!-- L  w70 -->
    <g transform="translate(0,0)">
      <path d="M0,10 H13 V97 H70 V110 H0 Z"/>
    </g>
    <!-- U  w70 -->
    <g transform="translate(92,0)">
      <path d="M0,10 V75 A35,35 0 0 0 70,75 V10 H57 V75 A22,22 0 0 1 13,75 V10 Z"/>
    </g>
    <!-- M  w92 -->
    <g transform="translate(184,0)">
      <path d="M0,10 H13 V110 H0 Z"/>
      <path d="M79,10 H92 V110 H79 Z"/>
      <path d="M0,10 H13 L52.5,110 H39.5 Z"/>
      <path d="M79,10 H92 L52.5,110 H39.5 Z"/>
    </g>
    <!-- E  w70 -->
    <g transform="translate(298,0)">
      
      <path d="M0,10 H70 V23 H13 V52 H70 V65 H13 V97 H70 V110 H0 Z"/>
    </g>
    <!-- N  w76 -->
    <g transform="translate(396,0)">
      <path d="M0,10 H13 V110 H0 Z"/>
      <path d="M63,10 H76 V110 H63 Z"/>
      <path d="M0,10 H13 L76,110 H63 Z"/>
    </g>
  </g>
</svg>
